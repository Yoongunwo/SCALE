apiVersion: v1
kind: Pod
metadata:
  name: central-auditd
  labels:
    app: central-auditd
spec:
  hostPID: true
  nodeSelector:
    kubernetes.io/hostname: w-1
  containers:
    - name: proxy
      image: # Centralized auditd image for latency experiments
      imagePullPolicy: Always
      securityContext:
        privileged: true
        capabilities:
          add: ['ALL']
        seccompProfile:
          type: Unconfined

      volumeMounts:
        - name: sys
          mountPath: /sys
        - name: debugfs
          mountPath: /sys/kernel/debug
        - name: modules
          mountPath: /lib/modules
        - name: audit-logs
          mountPath: /var/log/
        - name: etc-audit
          mountPath: /etc/audit
        - name: usr-local-bin
          mountPath: /usr/local/bin

      resources:
        requests:
          cpu: '30m'
        limits:
          cpu: '30m'

  volumes:
    - name: sys
      hostPath:
        path: /sys
    - name: debugfs
      hostPath:
        path: /sys/kernel/debug
    - name: modules
      hostPath:
        path: /lib/modules
    - name: audit-logs
      hostPath:
        path: /var/log/
    - name: etc-audit
      hostPath:
        path: /etc/audit
    - name: usr-local-bin
      hostPath:
        path: /usr/local/bin
