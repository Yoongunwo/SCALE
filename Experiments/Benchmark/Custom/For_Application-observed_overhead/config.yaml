apiVersion: apps/v1
kind: Deployment
metadata:
  name: sys-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sys-gen
  template:
    metadata:
      labels:
        app: sys-gen
    spec:
      containers:
        - name: sys-gen
          image: # Custom Benchmark image for application-observed overhead experiment
          imagePullPolicy: Always
          resources:
            # The benchmark must not be throttled. With CFS throttling the stalled part
            # of each 100ms period becomes an outlier and pollutes p99.
            requests:
              cpu: '30m'
            limits:
              cpu: '30m'
          env:
            - name: GEN_DURATION_SEC
              value: '30'
            - name: GEN_RATE_LIMIT
              value: '0' # 0 = unlimited. Back-to-back calls for as many samples as possible
            - name: GEN_LABEL # baseline | central | distributed | scale
              value: 'baseline'
      nodeSelector:
        kubernetes.io/hostname: w-1
