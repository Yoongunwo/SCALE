apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp2
spec:
  replicas: 30
  selector:
    matchLabels:
      app: exp2
  template:
    metadata:
      labels:
        app: exp2
    spec:
      shareProcessNamespace: true
      containers:
        - name: sys-gen
          image: # Postmark Benchmark image
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: '170m' }
            limits: { cpu: '170m' }
          env:
            - name: PM_MODE
              value: 'gate'
            - name: PM_GATE_LOOP
              value: '1'
        - name: proxy
          image: # Distributed Proxy image
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - ALL
            seccompProfile:
              type: Unconfined
          env:
            - name: RINGBUF_POW2
              value: '20'
          volumeMounts:
            - name: syscallname
              mountPath: /usr/include/x86_64-linux-gnu/asm
            - name: sys
              mountPath: /sys
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: modules
              mountPath: /lib/modules
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          resources:
            requests:
              cpu: '30m'
            limits:
              cpu: '30m'
      volumes:
        - name: syscallname
          hostPath:
            path: /usr/include/x86_64-linux-gnu/asm
        - name: sys
          hostPath:
            path: /sys
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: modules
          hostPath:
            path: /lib/modules
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
      nodeSelector:
        kubernetes.io/hostname: w-1
