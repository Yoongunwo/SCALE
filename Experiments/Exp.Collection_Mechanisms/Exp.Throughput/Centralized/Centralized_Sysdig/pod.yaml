apiVersion: v1
kind: Pod
metadata:
  name: central-sysdig
  labels:
    app: central-sysdig
spec:
  hostPID: true
  nodeSelector:
    kubernetes.io/hostname: w-1
  containers:
    - name: proxy
      image: # Centralized Sysdig image
      imagePullPolicy: Always
      securityContext:
        runAsUser: 0
        privileged: true
      volumeMounts:
        - name: dev
          mountPath: /dev
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: sys
          mountPath: /sys
          readOnly: true
      resources:
        requests:
          cpu: '900m'
        limits:
          cpu: '900m'
  volumes:
    - name: dev
      hostPath: { path: /dev, type: Directory }
    - name: modules
      hostPath: { path: /lib/modules, type: Directory }
    - name: sys
      hostPath: { path: /sys, type: Directory }
