apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp2
  template:
    metadata:
      labels:
        app: exp2
    spec:
      hostPID: true
      containers:
        - name: proxy
          image: # Auditd proxy image for latency experiment
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ['ALL']
            seccompProfile:
              type: Unconfined

          volumeMounts:
            - name: sys
              mountPath: /sys
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: modules
              mountPath: /lib/modules
            - name: audit-logs
              mountPath: /var/log/
            - name: etc-audit
              mountPath: /etc/audit
            - name: usr-local-bin
              mountPath: /usr/local/bin

          resources:
            requests:
              cpu: '30m'
            limits:
              cpu: '30m'

      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: modules
          hostPath:
            path: /lib/modules
        - name: audit-logs
          hostPath:
            path: /var/log/
        - name: etc-audit
          hostPath:
            path: /etc/audit
        - name: usr-local-bin
          hostPath:
            path: /usr/local/bin
      nodeSelector:
        kubernetes.io/hostname: w-1
