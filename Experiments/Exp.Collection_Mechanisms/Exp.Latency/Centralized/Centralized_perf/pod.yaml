apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp3
  template:
    metadata:
      labels:
        app: exp3
    spec:
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: w-1
      containers:
        - name: proxy
          image: # Centralized perf image
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ['ALL']
            seccompProfile:
              type: Unconfined
          env:
            - name: PERF_EXEC_PATH
              value: /usr/lib/linux-tools-5.15.0-141
            - name: PATH
              value: /usr/lib/linux-tools-5.15.0-141:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumeMounts:
            - name: sys
              mountPath: /sys
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-usrlib
              mountPath: /usr/bin/perf
              subPath: linux-tools-5.15.0-141/perf
              readOnly: true
            - name: host-usrlib
              mountPath: /usr/lib/linux-tools-5.15.0-141
              subPath: linux-tools-5.15.0-141
              readOnly: true
          resources:
            requests: { cpu: '750m' }
            limits: { cpu: '750m' }

      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-usrlib
          hostPath:
            path: /usr/lib
