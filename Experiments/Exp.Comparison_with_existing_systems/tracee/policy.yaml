apiVersion: tracee.aquasec.com/v1beta1
kind: Policy
metadata:
  name: sysgen-sysenter
spec:
  # scope selects "which targets to observe", while rules[].filters expresses
  # "conditions on the event data". A target qualifier placed in rules[].filters
  # is ignored and the policy ends up acting globally.
  #
  # podName= is not a valid scope option in this version (invalid scope option).
  # Instead, comm=postmark pins the workload process directly. This way we observe
  # exactly the same set of processes as the eBPF counter in main_controller that
  # produces the denominator (/proc/PID/comm == "postmark"), so the numerator and
  # denominator of the drop rate refer to the same population.
  scope:
    - container
    - comm=postmark
  rules:
    - event: sys_enter
