apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: sys-gen-rawsyscalls
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: sys-gen
  tracepoints:
  - subsystem: "raw_syscalls"
    event: "sys_enter"
    args:
      - index: 4
        type: "int64"   # syscall number
