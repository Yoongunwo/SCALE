apiVersion: v1
kind: Pod
metadata:
  name: exp
  labels:
    app: exp
spec:
  hostPID: true
  containers:
    - name: proxy
      image: # eAudit image
      imagePullPolicy: Always
      securityContext:
        privileged: true
      volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
        - name: sys-kernel-debug
          mountPath: /sys/kernel/debug
        - name: sys-kernel-tracing
          mountPath: /sys/kernel/tracing
        - name: log
          mountPath: /tmp/log
      resources:
        requests:
          cpu: '450m'
        limits:
          cpu: '450m'
  volumes:
    - name: lib-modules
      hostPath:
        path: /lib/modules
        type: Directory
    - name: usr-src
      hostPath:
        path: /usr/src
        type: DirectoryOrCreate
    - name: sys-kernel-debug
      hostPath:
        path: /sys/kernel/debug
        type: Directory
    - name: sys-kernel-tracing
      hostPath:
        path: /sys/kernel/tracing
        type: DirectoryOrCreate
    - name: log
      hostPath:
        path: /home/yoon/eaudit
        type: DirectoryOrCreate
  nodeSelector:
    kubernetes.io/hostname: # node name
